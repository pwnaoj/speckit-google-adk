schema_version: "1.0"

extension:
  id: "adk"
  name: "Google ADK"
  version: "0.1.0"
  description: "Spec-driven development of Google ADK agents: architecture planning and traceable evaluation sets."
  author: "Joan"
  license: "MIT"

requires:
  speckit_version: ">=1.2.5"
  tools:
    - name: "google-adk[eval]"
      version: ">=2.13.0"
      required: false

provides:
  commands:
    - name: "speckit.adk.design"
      file: "commands/design.md"
      description: "Add the ADK architecture section to plan.md"
    - name: "speckit.adk.evalset"
      file: "commands/evalset.md"
      description: "Generate an ADK evalset from the acceptance scenarios in spec.md"
    - name: "speckit.adk.eval"
      file: "commands/eval.md"
      description: "Run adk eval and map failures to user stories"
    - name: "speckit.adk.review"
      file: "commands/review.md"
      description: "Check traceability between spec, plan and evalset"

  templates:
    - name: "adk-plan-section"
      file: "templates/adk-plan-section.md"
      description: "ADK architecture section for plan.md"
    - name: "adk-evalset"
      file: "templates/adk-evalset.template.json"
      description: "Skeleton of an ADK evalset file"

  scripts:
    - name: "validate-evalset"
      file: "scripts/validate_evalset.py"
      description: "Validate the structure and ids of an evalset"
      runtimes: ["python"]
    - name: "check-traceability"
      file: "scripts/check_traceability.py"
      description: "Compare spec scenarios with eval cases"
      runtimes: ["python"]
    - name: "summarize-results"
      file: "scripts/summarize_results.py"
      description: "Summarize adk eval results by eval id"
      runtimes: ["python"]

  config:
    - name: "adk-config.yml"
      template: "templates/adk-config.template.yml"
      description: "ADK extension configuration"
      required: false

hooks:
  after_plan:
    command: "speckit.adk.design"
    optional: true
    prompt: "Add the ADK architecture section to plan.md?"
    description: "Design the ADK agent architecture"
  after_tasks:
    command: "speckit.adk.evalset"
    optional: true
    prompt: "Generate the ADK evalset from the spec scenarios?"
    description: "Generate the evaluation set"
  after_implement:
    command: "speckit.adk.eval"
    optional: true
    prompt: "Run the ADK evaluation now? It calls the model."
    description: "Evaluate the implemented agent"

tags:
  - "adk"
  - "agents"
  - "evaluation"
